[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "text2sql-structural-supervision"
version = "0.1.0"
description = "Structure-supervised QLoRA, base KL regularization, and constrained Text-to-SQL generation"
requires-python = ">=3.12"
dependencies = ["sqlglot==27.29.0", "numpy>=2.0"]

[project.optional-dependencies]
gpu = ["torch==2.8.0", "transformers==4.57.6", "peft==0.18.0", "accelerate==1.12.0", "bitsandbytes==0.50.2", "llguidance==1.9.1", "safetensors>=0.6"]

[project.scripts]
text2sql = "text2sql.runtime:main"

[tool.setuptools.packages.find]
include = ["text2sql*"]

[tool.setuptools.package-data]
text2sql = ["*.lark", "assets/*.lark"]
